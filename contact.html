<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen flex items-center justify-center bg-cover bg-center"
    style="
      background-image: url(&quot;https://images.unsplash.com/photo-1556742059-47b93231f536?q=80&w=2070&quot;);
    "
  >
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Container -->
    <div
      class="relative z-10 grid md:grid-cols-2 max-w-5xl w-full mx-4 bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden"
    >
      <!-- LEFT SIDE -->
      <div
        class="hidden md:flex flex-col justify-center p-10 text-white bg-gradient-to-br from-purple-600/80 to-blue-600/80"
      >
        <h1 class="text-4xl font-bold mb-4">Get in Touch</h1>

        <p class="text-lg mb-6">
          We'd love to hear from you. Send us your message and we’ll respond as
          soon as possible.
        </p>

        <div class="space-y-3 text-sm">
          <p>📍 Mumbai, India</p>
          <p>📞 +91 98765 43210</p>
          <p>✉️ bakery@email.com</p>
        </div>
      </div>

      <!-- RIGHT SIDE FORM -->
      <div class="p-8 bg-white rounded-r-3xl">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Contact Us</h2>

        <form onsubmit="showPopup(event)" class="space-y-4">
          <div>
            <label class="text-sm text-gray-600">Name</label>
            <input
              type="text"
              required
              class="w-full mt-1 p-3 rounded-lg border focus:ring-2 focus:ring-purple-400 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-600">Email</label>
            <input
              type="email"
              required
              class="w-full mt-1 p-3 rounded-lg border focus:ring-2 focus:ring-purple-400 outline-none"
            />
          </div>

          <div>
            <label class="text-sm text-gray-600">Message</label>
            <textarea
              rows="4"
              required
              class="w-full mt-1 p-3 rounded-lg border focus:ring-2 focus:ring-purple-400 outline-none"
            ></textarea>
          </div>

          <button
            class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition transform hover:scale-105"
          >
            Send Message 🚀
          </button>
        </form>
      </div>
    </div>

    <!-- SUCCESS POPUP -->
    <div
      id="popup"
      class="fixed inset-0 hidden items-center justify-center bg-black/60 z-50"
    >
      <div class="bg-white p-6 rounded-xl shadow-xl text-center">
        <h2 class="text-xl font-bold text-green-600">Message Sent!</h2>
        <p class="text-gray-600 mt-2">We will contact you soon.</p>
        <button
          onclick="closePopup()"
          class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg"
        >
          OK
        </button>
      </div>
    </div>

    <!-- JS -->
    <script>
      function showPopup(e) {
        e.preventDefault();
        document.getElementById("popup").classList.remove("hidden");
      }

      function closePopup() {
        document.getElementById("popup").classList.add("hidden");
      }
    </script>
  </body>
</html>
